# Reglages de la moitie droite (centrale, reliee au PC).
# NB : taktyl.conf n'est pas lu par Zephyr (seul <shield>.conf l'est).
CONFIG_ZMK_SLEEP=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_I2C=y
CONFIG_GPIO=y

CONFIG_ZMK_BLE_KEYBOARD_REPORT_QUEUE_SIZE=50
CONFIG_INPUT_THREAD_STACK_SIZE=2048
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=4096

CONFIG_LOG=n
CONFIG_ZMK_USB_LOGGING=n
#CONFIG_ZMK_LOG_LEVEL_DBG=n
#CONFIG_LOG_MAX_LEVEL=3

CONFIG_ADC=y
CONFIG_ANALOG_INPUT=y

CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_TRACKPAD=y
CONFIG_INPUT=y
CONFIG_INPUT_AZOTEQ_IQS5XX=y

# Un rapport PTP 5 doigts fait 28 octets : il faut un MTU ATT > 31
# (20 octets utiles seulement avec le MTU par defaut).
CONFIG_BT_CTLR_DATA_LENGTH_MAX=69

CONFIG_BT_L2CAP_TX_MTU=65
CONFIG_BT_BUF_ACL_TX_SIZE=69
CONFIG_BT_BUF_ACL_RX_SIZE=69

CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6

CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
