# Proprietes communes du driver Azoteq IQS5xx (mode Windows Precision Touchpad).
properties:
  rdy-gpios:
    type: phandle-array
    required: true
    description: "Broche RDY (donnees pretes) de l'IQS5xx"

  reset-gpios:
    type: phandle-array
    description: |
      Broche reset de l'IQS5xx. Fortement recommandee : elle sert a relancer
      le capteur en cas d'erreur I2C et au reveil.

  switch-xy:
    type: boolean
    description: "Echange les axes X et Y"

  flip-x:
    type: boolean
    description: "Inverse le sens de l'axe X"

  flip-y:
    type: boolean
    description: "Inverse le sens de l'axe Y"

  palm_rejection:
    type: boolean
    description: "Active le rejet de la paume de l'IQS5xx"

  palm_reject_threshold:
    type: int
    default: 100
    description: "Surface a partir de laquelle un contact est considere comme une paume"

  palm_reject_timeout:
    type: int
    default: 4
    description: "Delai avant de desactiver le rejet de paume (multiple de 32 ms)"

  max_touch_number:
    type: int
    default: 5
    description: "Nombre maximum de doigts suivis (1 a 5)"

  resolution_x:
    type: int
    default: 3072
    description: "Resolution de sortie de l'axe X"

  resolution_y:
    type: int
    default: 2048
    description: "Resolution de sortie de l'axe Y"

  bottom-beta:
    type: int
    default: 5
    description: |
      Filtrage aux faibles vitesses.
      0 : filtrage maximal (lisse mais plus de latence), 255 : filtrage minimal.

  stationary-threshold:
    type: int
    default: 5
    description: "Deplacement (en points) en dessous duquel un doigt est considere immobile"

  report_rate_active_mode:
    type: int
    default: 8
    description: "Intervalle de rapport (ms) quand un doigt bouge ou est pose"

  report_rate_idle_mode:
    type: int
    default: 16
    description: |
      Intervalle de rapport (ms) sans doigt pose. Fixe le delai maximal de
      detection du premier toucher.

  report_rate_lp1_mode:
    type: int
    default: 40
    description: "Intervalle de rapport (ms) en basse consommation 1 (apres idle_timeout)"

  report_rate_lp2_mode:
    type: int
    default: 100
    description: "Intervalle de rapport (ms) en basse consommation 2 (apres une longue inactivite)"

  idle_timeout:
    type: int
    default: 20
    description: "Secondes sans toucher avant de passer en basse consommation 1 (255 = jamais)"
